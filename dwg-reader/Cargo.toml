[package]
name = "plantview-dwg"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
acadrust = { path = "vendor/acadrust" }
opencadkernel = { path = "vendor/opencadkernel", features = ["acis"] }
